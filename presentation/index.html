</style></head><body><div class="deck"><div class="frame"><header class="top"><div class="brand"><span class="mark"></span> SEAP / Procurement intelligence</div><div class="topright">Dataset presentation &nbsp; · &nbsp; 11 noiembrie 2026</div></header><main id="slide" aria-live="polite"></main><footer class="footer"><div class="presenter" id="presenter"></div><div class="controls"><button class="btn" id="fullscreenBtn" aria-label="Intră în modul ecran complet">⛶ Ecran complet</button><button class="btn" id="notesBtn" aria-expanded="false">Note vorbitor</button><button class="btn arrow" id="prev" aria-label="Slide anterior">←</button><span class="counter" id="counter"></span><button class="btn arrow" id="next" aria-label="Slide următor">→</button></div></footer><div class="progress" id="progress"></div></div></div><script>
const slides=[
{speaker:'Mihnea',body:`<div class="grid"><div><div class="eyebrow">01 / Întrebarea</div><h1>Ce ne spun<br><span class="highlight">achizițiile</span><br>publice?</h1><p class="lead">Construim un dataset unificat pentru a înțelege ce cumpără instituțiile publice, de la cine și la ce valori.</p><div class="tags"><span class="tag">România</span><span class="tag">2007–2025</span><span class="tag">Date deschise</span></div></div><div class="bigcard"><div class="label" style="color:#b9d7bc">Colecția importată</div><div class="stat number">20,4 milioane</div><div class="statlabel">de înregistrări din exporturi publice</div><div class="splitstats"><div><strong>86</strong><span>resurse</span></div><div><strong>19 ani</strong><span>de exporturi</span></div><div><strong>16</strong><span>structuri inițiale</span></div></div></div></div>`,notes:`<p>Bună ziua! Proiectul nostru pornește de la o întrebare simplă. Ce putem afla despre achizițiile publice din România dacă punem datele din mai mulți ani în același format?</p><p>Exporturile există pe data.gov.ro, dar sunt împărțite pe ani și pe tipuri de achiziții, iar coloanele diferă de la un fișier la altul. Am descărcat 86 de resurse din perioada 2007–2025 și am aliniat 16 structuri de coloane la același model. De exemplu, o valoare publicată ca text devine o sumă numerică, iar formatul original rămâne disponibil pentru verificare.</p><p>Rezultatul este o colecție de peste 20 de milioane de rânduri din exporturi. Un contract poate apărea în mai multe rânduri. Pe această bază putem studia ce cumpără instituțiile, de la cine și la ce valori. </p><p>Mai întai să vedem sursele și cum le-am pus împreună.</p>`},
{speaker:'Andrei',body:`<div class="eyebrow">02 / Sursele</div><h2>Date oficiale, <span class="highlight">adunate în timp</span></h2><p class="lead">Sursa principală: exporturi SEAP publicate pe data.gov.ro. Sursele de referință completează verificarea.</p><div class="timeline"><div class="year"><b>2007–2018</b><p>Contracte publicate și contracte subsecvente.</p></div><div class="year"><b>2019–2025</b><p>Contracte publicate și achiziții directe.</p></div><div class="year"><b>Referințe</b><p>BNR pentru curs, ONRC pentru firme, TED pentru CPV.</p></div></div><div class="callout">86 de resurse importate · formate CSV, XLS și XLSX · <b>aprox. 7,67 GB</b> de fișiere-sursă</div><div class="links"><a href="https://data.gov.ro/" target="_blank" rel="noopener">data.gov.ro ↗</a><a href="https://ted.europa.eu/ro/simap/cpv" target="_blank" rel="noopener">TED / CPV ↗</a><a href="https://data.gov.ro/dataset/firme-19-10-2026" target="_blank" rel="noopener">ONRC ↗</a><a href="https://www.bnr.ro/Cursul-de-schimb-524.aspx" target="_blank" rel="noopener">BNR ↗</a></div>`,notes:`<p>Am pornit de la exporturile SEAP publicate pe data.gov.ro. Cele 86 de resurse înseamnă aproximativ 7,67 GB de fișiere CSV și Excel. Pentru perioada istorică avem contracte publicate, iar în anii în care apar în resursele importate, contracte subsecvente. În resursele din 2019 încoace apar și achizițiile directe. Acoperirea diferă după an și după tipul achiziției.</p><p>Am folosit trei surse de referință. BNR ne dă cursurile istorice, ONRC ne ajută să verificăm identitatea firmelor printr-o copie a registrului din octombrie 2026, iar TED publică nomenclatorul CPV, adică lista oficială a codurilor care clasifică obiectul achizițiilor.</p>`},
{speaker:'Andrei',body:`<div class="eyebrow">03 / De la surse la dataset</div><h2>Unificăm <span class="highlight">16 structuri</span><br>într-un model comun</h2><div class="steps"><div class="step"><span class="num">01 / IMPORT</span><h3>Descărcare</h3><p>Resursele oficiale și informațiile despre surse sunt păstrate pentru trasabilitate.</p></div><div class="step"><span class="num">02 / PARSARE</span><h3>Formate comune</h3><p>Citire CSV / Excel, interpretarea datelor calendaristice și a sumelor.</p></div><div class="step"><span class="num">03 / MODEL</span><h3>Entități separate</h3><p>Achiziții, autorități, furnizori, coduri CPV și cursuri valutare.</p></div><div class="step"><span class="num">04 / FILTRE</span><h3>Vederi analitice</h3><p>Înregistrările eligibile sunt selectate; originalele rămân pentru audit.</p></div></div><div class="callout">Modelul păstrează valoarea și moneda originală. Echivalentul în EUR folosește cursul BNR disponibil la sau înaintea datei alese.</div>`,notes:`<p>După descărcare, am păstrat legătura cu fiecare resursă, ca să putem urmări de unde vine o observație. Am citit fișierele, am mapat coloanele echivalente în aceeași schemă și am interpretat sumele și datele. Dacă o valoare lipsește sau nu poate fi citită, o marcăm. Apoi am separat achizițiile de autorități și furnizori și am construit vederi care selectează rândurile eligibile pentru analiză.</p><p>Pentru comparații, păstrăm suma și moneda din sursă și calculăm echivalentul în euro la data relevantă. Când nu există cotație exact în acea zi, luăm ultima cotație BNR disponibilă sau înainte de dată, în limita a șapte zile.</p>`},
{speaker:'Darius',body:`<div class="grid equal"><div><div class="eyebrow">04 / Curățarea</div><h2>Cinci verificări,<br><span class="highlight">limite clare</span></h2><p class="lead">Curățarea înseamnă și să marcăm ce trebuie verificat, nu doar să eliminăm rânduri.</p><div class="callout">Datele originale și baza completă rămân locale pentru audit.</div></div><div class="items"><div class="item"><b>Formate</b><span>Uniformizăm datele, sumele și valorile lipsă.</span></div><div class="item"><b>Firme</b><span>Comparăm CUI și nume cu snapshotul ONRC.</span></div><div class="item"><b>CPV</b><span>Verificăm codurile și versiunile istorice.</span></div><div class="item"><b>Confidențialitate</b><span>Ascundem textele semnalate în vederea filtrată.</span></div><div class="item"><b>Duplicate</b><span>Marcăm duplicate exacte și identificăm candidați pentru revizuire.</span></div></div></div>`,notes:`<p>Prima verificare privește formatele. Standardizăm datele calendaristice și sumele și marcăm valorile lipsă. Pentru firme, comparăm CUI-ul și numele normalizat cu registrul ONRC. O potrivire ne ajută să identificăm firma, iar statutul ei la data contractului rămâne o verificare separată.</p><p>Pentru CPV, verificăm codul în nomenclatorul potrivit perioadei. Apoi completăm un cod lipsă doar când denumirea oficială indică o singură potrivire și contextul o susține. În textele libere căutăm semnale cum ar fi adrese de e-mail sau numere de telefon și mascăm câmpurile semnalate în vederea filtrată.</p><p>Pentru duplicate, marcăm separat rândurile identice și perechile asemănătoare. Cele similare rămân disponibile pentru verificare.</p>`},
{speaker:'Bogdan',body:`<div class="grid equal"><div><div class="eyebrow">05 / Rezultat și calitate</div><h2>Un dataset pregătit<br><span class="highlight">pentru analiză</span></h2><p class="lead">Filtrele fac datele utilizabile, dar nu elimină toate incertitudinile.</p><div class="callout"><b>Atenție:</b> rândurile sunt observații din exporturi, nu neapărat contracte unice sau plăți efective.</div></div><div><div class="metrics"><div class="metric dark"><div class="number">19,85 mil.</div><p>rânduri eligibile pentru analiza valorilor</p></div><div class="metric"><div class="number">119.734</div><p>duplicate exacte marcate</p></div><div class="metric"><div class="number">57.971</div><p>coduri CPV recuperate după reguli stricte</p></div><div class="metric"><div class="number">1,66 mil.</div><p>perechi candidate la duplicare, de verificat</p></div></div><p class="small">Categoriile pot avea suprapuneri. Candidații sunt perechi, nu număr de contracte duplicate. Vederea filtrată nu este un set complet anonimizat.</p></div></div>`,notes:`<p>Din cele 20,4 milioane de rânduri importate, 19,85 milioane trec filtrele pentru analiza valorilor. Au o autoritate identificabilă, o sumă pozitivă și o dată utilizabilă, iar filtrul exclude rândurile marcate ca duplicate exacte. În total am marcat 119.734 de astfel de rânduri și am păstrat datele originale.</p><p>Am recuperat și aproape 58.000 de coduri CPV. Cifra de 1,66 milioane se referă la perechi candidate la duplicare, care așteaptă o verificare. Un singur rând poate apărea în mai multe perechi. Pentru interpretarea sumelor, o valoare din export arată ce s-a publicat despre achiziție. Plata efectivă ar trebui confirmată dintr-o sursă separată.</p>`},
{speaker:'Mihnea + Bogdan',body:`<div class="eyebrow">06 / Concluzie</div><h2>86 de exporturi<br><span class="highlight">un singur dataset</span></h2><div class="uses"><div class="use"><b>01 / Predicția valorii</b><p>Estimăm valori pentru achiziții comparabile.</p></div><div class="use"><b>02 / Detectarea anomaliilor</b><p>Semnalăm tipare care merită verificate.</p></div><div class="use"><b>03 / Prognoză</b><p>Analizăm tendințele valorilor în timp.</p></div><div class="use"><b>04 / Rețele și furnizori</b><p>Explorăm relațiile dintre instituții și firme.</p></div><div class="use"><b>05 / Clasificare produse</b><p>Folosim descrierile și codurile CPV.</p></div><div class="use"><b>Primul test</b><p>Estimăm valoarea achizițiilor comparabile.</p></div></div><p class="small">Aplicații propuse. Verificăm anomaliile în context.</p>`,notes:`<p>Mihnea — Ce am obținut concret? Acum putem analiza împreună date din 86 de exporturi. De exemplu, putem selecta achizițiile dintr-o categorie și putem vedea ce valori s-au publicat și cine sunt furnizorii.</p><p>Primul test ar fi să luăm o categorie în care achizițiile seamănă și să vedem cât de bine putem estima valoarea lor totală din exemple mai vechi. Două contracte din aceeași categorie pot include cantități diferite, așa că începem cu un grup restrâns. </p><p>Bogdan — Vom începe cu duplicatele candidate și identitățile ambigue. Putem căuta surse suplimentare pentru a verifica posibile legături între furnizori și persoane publice. Orice asociere ar trebui documentată și verificată independent înainte de a trage o concluzie.</p>`}];
let i=0,showNotes=false;const el=document.getElementById('slide');function render(){const s=slides[i];el.innerHTML=s.body+`<aside class="notes ${showNotes?'open':''}" id="notes"><h3>Note pentru prezentatori</h3>${s.notes}</aside>`;document.getElementById('presenter').textContent=s.speaker;document.getElementById('counter').textContent=String(i+1).padStart(2,'0')+' / 06';document.getElementById('progress').style.width=((i+1)/6*100)+'%';document.getElementById('notesBtn').setAttribute('aria-expanded',showNotes);document.getElementById('notesBtn').textContent=showNotes?'Ascunde notele':'Note vorbitor';document.getElementById('prev').disabled=i===0;document.getElementById('next').disabled=i===5;history.replaceState(null,'','#'+(i+1))}function go(d){i=Math.max(0,Math.min(5,i+d));render()}const fullscreenBtn=document.getElementById('fullscreenBtn');function syncFullscreen(){const active=!!(document.fullscreenElement||document.webkitFullscreenElement);fullscreenBtn.textContent=active?'⛶ Ieși din ecran complet':'⛶ Ecran complet';fullscreenBtn.setAttribute('aria-label',active?'Ieși din modul ecran complet':'Intră în modul ecran complet')}async function toggleFullscreen(){try{if(document.fullscreenElement||document.webkitFullscreenElement){if(document.exitFullscreen)await document.exitFullscreen();else if(document.webkitExitFullscreen)document.webkitExitFullscreen()}else{const root=document.documentElement;if(root.requestFullscreen)await root.requestFullscreen();else if(root.webkitRequestFullscreen)root.webkitRequestFullscreen();else alert('Folosește modul ecran complet al browserului pentru a ascunde barele de navigare.')}}catch(err){alert('Nu s-a putut activa ecranul complet. Folosește modul ecran complet al browserului.')}}fullscreenBtn.onclick=toggleFullscreen;document.addEventListener('fullscreenchange',syncFullscreen);document.addEventListener('webkitfullscreenchange',syncFullscreen);document.getElementById('prev').onclick=()=>go(-1);document.getElementById('next').onclick=()=>go(1);document.getElementById('notesBtn').onclick=()=>{showNotes=!showNotes;render()};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();go(1)}if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(-1)}if(e.key.toLowerCase()==='n'){showNotes=!showNotes;render()}if(e.key.toLowerCase()==='f'&&!e.metaKey&&!e.ctrlKey&&!e.altKey){e.preventDefault();toggleFullscreen()}});let start=Number(location.hash.slice(1));if(start>=1&&start<=6)i=start-1;render();
</script></body></html>
