:root{--ink:#172b29;--muted:#60736c;--cream:#f4f3e9;--lime:#d9ee79;--green:#205d49;--line:#cbd5c4}*{box-sizing:border-box}body{margin:0;background:#152d28;color:var(--ink);font-family:'DM Sans',sans-serif}button,a{font:inherit}button{cursor:pointer}a{color:inherit}.deck{min-height:100dvh;display:flex;align-items:stretch;justify-content:stretch;padding:0}.frame{background:var(--cream);width:100%;min-height:100dvh;position:relative;overflow:hidden;border-radius:0;display:flex;flex-direction:column}.top{display:flex;align-items:center;justify-content:space-between;padding:26px 46px;border-bottom:1px solid var(--line);font-size:12px;font-weight:700;letter-spacing:.13em;text-transform:uppercase}.brand{display:flex;align-items:center;gap:10px}.mark{width:13px;height:13px;background:#267254;transform:rotate(45deg)}.topright{color:var(--muted)}main{flex:1;padding:46px 68px 36px;display:flex;flex-direction:column;justify-content:center}.eyebrow{font-size:12px;letter-spacing:.19em;text-transform:uppercase;color:#35725a;font-weight:700;margin-bottom:20px}.grid{display:grid;grid-template-columns:1.12fr .88fr;gap:70px;align-items:center}.grid.equal{grid-template-columns:1fr 1fr}.label{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#527166}.pill{display:inline-block;border:1px solid #9bb09b;border-radius:30px;padding:8px 12px;font-size:11px;letter-spacing:.1em;font-weight:700;text-transform:uppercase}h1,h2,h3,.number{font-family:'Space Grotesk',sans-serif;letter-spacing:-.055em}h1{font-size:clamp(52px,6.5vw,94px);line-height:.98;margin:0 0 26px}h2{font-size:clamp(40px,4.2vw,63px);line-height:1.06;margin:0 0 22px;max-width:800px}h3{font-size:23px;margin:0 0 9px}p{line-height:1.5}p.lead{font-size:clamp(18px,1.6vw,23px);line-height:1.5;max-width:670px;color:#435c52;margin:0}.highlight{color:#347455}.bigcard{background:#204c3e;color:#f5f5e9;padding:38px;border-radius:4px;position:relative;overflow:hidden}.bigcard:after{content:'';position:absolute;width:210px;height:210px;border:1px solid #ffffff2b;border-radius:50%;right:-65px;top:-75px}.stat{font-size:clamp(45px,4.6vw,70px);line-height:1;font-weight:700;margin:25px 0 8px}.statlabel{font-size:16px;color:#c3dfca}.splitstats{display:flex;gap:30px;border-top:1px solid #ffffff35;margin-top:27px;padding-top:25px}.splitstats strong{font-family:'Space Grotesk';font-size:31px;display:block}.splitstats span{font-size:13px;color:#c3dfca}.timeline{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:34px}.year{border-top:3px solid #347455;padding:15px 12px 0 0}.year b{font-family:'Space Grotesk';font-size:25px}.year p{font-size:14px;color:#526a5f}.tags{display:flex;gap:9px;flex-wrap:wrap;margin-top:26px}.tag{background:#e1e9d7;border-radius:3px;padding:9px 12px;font-size:13px;font-weight:600}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-top:35px}.step{border-top:3px solid #2e6b51;padding-top:18px}.step .num{color:#6b8a78;font-size:12px;font-weight:700;letter-spacing:.1em}.step h3{margin:16px 0 8px;font-size:21px}.step p{font-size:14px;color:#536b60}.callout{background:#deebc9;padding:19px 22px;margin-top:28px;font-size:15px;line-height:1.5;border-left:4px solid #43805f}.items{display:grid;gap:0}.item{padding:18px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:145px 1fr;gap:15px;align-items:baseline}.item b{font-family:'Space Grotesk';font-size:21px}.item span{color:#50675c;font-size:15px;line-height:1.45}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:12px}.metric{background:#e4eadb;min-height:150px;padding:22px}.metric.dark{background:#235a45;color:white}.metric .number{font-size:40px;font-weight:700;line-height:1.05}.metric p{font-size:14px;line-height:1.4;margin:10px 0 0}.metric.dark p{color:#d4e9d6}.small{font-size:12px;color:#61786b;line-height:1.5;margin-top:17px}.uses{display:grid;grid-template-columns:1fr 1fr;gap:12px}.use{border:1px solid #c3d0bf;padding:17px}.use b{font-size:16px}.use p{font-size:13px;margin:6px 0 0;color:#586f63}.footer{padding:16px 46px 21px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);gap:20px}.presenter{font-size:13px;font-weight:700}.presenter span{font-weight:400;color:#61766b;margin-left:8px}.controls{display:flex;align-items:center;gap:9px}.btn{border:1px solid #afc0af;background:transparent;color:var(--ink);padding:9px 13px;border-radius:3px}.btn:hover,.btn:focus-visible{background:#d9e8ca}.arrow{font-size:20px;line-height:1;padding:7px 13px}.counter{font-family:'Space Grotesk';font-size:13px;min-width:50px;text-align:center}.progress{position:absolute;bottom:0;left:0;height:4px;background:#3c8b62;transition:width .2s}.notes{display:none;background:#fffef5;border:1px solid #c3d0bf;padding:26px 30px;margin-top:27px;max-width:980px;box-shadow:0 8px 30px #203a2820}.notes.open{display:block}.notes h3{font-size:18px;letter-spacing:0}.notes p{font-size:15px;line-height:1.65;margin:10px 0}.notes .timing{font-weight:700;color:#35725a}.links{font-size:12px;margin-top:16px;color:#456b55}.links a{margin-right:14px}.hint{font-size:11px;color:#82958b;margin-right:9px}@media(max-width:800px){.deck{padding:0}.frame{min-height:100dvh;border-radius:0}.top{padding:20px}.topright{display:none}main{padding:36px 24px;justify-content:flex-start}.grid,.grid.equal{grid-template-columns:1fr;gap:27px}h1{font-size:52px}.steps{grid-template-columns:1fr 1fr}.timeline{gap:7px}.year b{font-size:20px}.metrics{gap:8px}.metric{min-height:125px;padding:16px}.metric .number{font-size:30px}.item{grid-template-columns:125px 1fr;column-gap:12px}.item b{font-size:17px}.footer{padding:14px 20px}.hint{display:none}.presenter span{display:block;margin:4px 0}.btn{padding:8px}.arrow{padding:6px 10px}}@media print{body{background:white}.deck{padding:0}.frame{box-shadow:none}.footer,.top,.progress{display:none}}

</style></head><body><div class="deck"><div class="frame"><header class="top"><div class="brand"><span class="mark"></span> SEAP / Procurement intelligence</div><div class="topright">Dataset presentation &nbsp; · &nbsp; 11 noiembrie 2026</div></header><main id="slide" aria-live="polite"></main><footer class="footer"><div class="presenter" id="presenter"></div><div class="controls"><button class="btn" id="fullscreenBtn" aria-label="Intră în modul ecran complet">⛶ Ecran complet</button><button class="btn" id="notesBtn" aria-expanded="false">Note vorbitor</button><button class="btn arrow" id="prev" aria-label="Slide anterior">←</button><span class="counter" id="counter"></span><button class="btn arrow" id="next" aria-label="Slide următor">→</button></div></footer><div class="progress" id="progress"></div></div></div><script>
const slides=[
  {
    "speaker": "Mihnea",
    "body": "<div class=\"grid\"><div><div class=\"eyebrow\">01 / Întrebarea</div><h1>Ce ne spun<br><span class=\"highlight\">achizițiile</span><br>publice?</h1><p class=\"lead\">Construim un dataset unificat pentru a înțelege ce cumpără instituțiile publice, de la cine și la ce valori.</p><div class=\"tags\"><span class=\"tag\">România</span><span class=\"tag\">2007–2025</span><span class=\"tag\">Date deschise</span></div></div><div class=\"bigcard\"><div class=\"label\" style=\"color:#b9d7bc\">Colecția importată</div><div class=\"stat number\">20,4 milioane</div><div class=\"statlabel\">de înregistrări din exporturi publice</div><div class=\"splitstats\"><div><strong>86</strong><span>resurse</span></div><div><strong>19 ani</strong><span>de exporturi</span></div><div><strong>16</strong><span>structuri inițiale</span></div></div></div></div>",
    "notes": "<p>Bună ziua! Ce putem afla despre achizițiile publice din România dacă punem datele din mai mulți ani în același format?</p>\n<p>Am pornit de la o problemă simplă. Fișierele sunt publice, dar sunt împărțite pe ani și pe tipuri de achiziții. În plus, coloanele diferă de la un export la altul. Am adus 86 de exporturi din perioada 2007–2025 într-o structură comună și am obținut 20,4 milioane de rânduri. Unele rânduri se pot referi la aceeași achiziție.</p>\n<p>Acum putem căuta într-un singur loc ce cumpără instituțiile, de la cine și la ce valori. Dar mai întâi, să vedem de unde luăm datele.</p>"
  },
  {
    "speaker": "Andrei",
    "body": "<div class=\"eyebrow\">02 / Sursele</div><h2>Date oficiale, <span class=\"highlight\">adunate în timp</span></h2><p class=\"lead\">Sursa principală: exporturi SEAP publicate pe data.gov.ro. Sursele de referință completează verificarea.</p><div class=\"timeline\"><div class=\"year\"><b>2007–2018</b><p>Contracte publicate și contracte subsecvente.</p></div><div class=\"year\"><b>2019–2025</b><p>Contracte publicate și achiziții directe.</p></div><div class=\"year\"><b>Referințe</b><p>BNR pentru curs, ONRC pentru firme, TED pentru CPV.</p></div></div><div class=\"callout\">86 de resurse importate · formate CSV, XLS și XLSX · <b>aprox. 7,67 GB</b> de fișiere-sursă</div><div class=\"links\"><a href=\"https://data.gov.ro/\" target=\"_blank\" rel=\"noopener\">data.gov.ro ↗</a><a href=\"https://ted.europa.eu/ro/simap/cpv\" target=\"_blank\" rel=\"noopener\">TED / CPV ↗</a><a href=\"https://data.gov.ro/dataset/firme-19-10-2026\" target=\"_blank\" rel=\"noopener\">ONRC ↗</a><a href=\"https://www.bnr.ro/Cursul-de-schimb-524.aspx\" target=\"_blank\" rel=\"noopener\">BNR ↗</a></div>",
    "notes": "<p>Am descărcat datele din catalogul data.gov.ro, unde sunt publicate exporturile SEAP. Cele 86 de fișiere, în format CSV sau Excel, acoperă perioada 2007–2025. În arhivele mai vechi am preluat contracte publicate și, pentru anii în care erau disponibile, contracte subsecvente. Din 2019 am inclus și achizițiile directe. De aceea, înainte de a compara doi ani, verificăm dacă avem aceleași tipuri de achiziții.</p>\n<p>Am folosit și trei surse de referință. De la BNR am luat cursurile valutare, din registrul ONRC am verificat identificarea firmelor, iar de la TED am luat nomenclatorul CPV. Acesta grupează achizițiile după ce s-a cumpărat. Să vedem cum am adus fișierele în același format.</p>"
  },
  {
    "speaker": "Andrei",
    "body": "<div class=\"eyebrow\">03 / De la surse la dataset</div><h2>Unificăm <span class=\"highlight\">16 structuri</span><br>într-un model comun</h2><div class=\"steps\"><div class=\"step\"><span class=\"num\">01 / IMPORT</span><h3>Descărcare</h3><p>Resursele oficiale și informațiile despre surse sunt păstrate pentru trasabilitate.</p></div><div class=\"step\"><span class=\"num\">02 / PARSARE</span><h3>Formate comune</h3><p>Citire CSV / Excel, interpretarea datelor calendaristice și a sumelor.</p></div><div class=\"step\"><span class=\"num\">03 / MODEL</span><h3>Entități separate</h3><p>Achiziții, autorități, furnizori, coduri CPV și cursuri valutare.</p></div><div class=\"step\"><span class=\"num\">04 / FILTRE</span><h3>Vederi analitice</h3><p>Înregistrările eligibile sunt selectate; originalele rămân pentru audit.</p></div></div><div class=\"callout\">Modelul păstrează valoarea și moneda originală. Echivalentul în EUR folosește cursul BNR disponibil la sau înaintea datei alese.</div>",
    "notes": "<p>După descărcare, am găsit 16 structuri diferite. Dacă două fișiere aveau denumiri diferite pentru aceeași informație, am pus câmpul în aceeași coloană. Dacă o sumă era scrisă ca text, am convertit-o într-un număr și am păstrat valoarea originală. Așa putem reveni la fișier când ceva pare neobișnuit.</p>\n<p>În baza comună am legat fiecare achiziție de autoritate și de furnizor. Am păstrat suma și moneda din sursă și am calculat echivalentul în euro folosind cursul BNR din ziua relevantă sau ultima cotație anterioară, în limita a șapte zile.</p>\n<p>După ce am adus datele în același format, am putut trece la verificări.</p>"
  },
  {
    "speaker": "Darius",
    "body": "<div class=\"grid equal\"><div><div class=\"eyebrow\">04 / Curățarea</div><h2>Cinci verificări,<br><span class=\"highlight\">limite clare</span></h2><p class=\"lead\">Curățarea înseamnă și să marcăm ce trebuie verificat, nu doar să eliminăm rânduri.</p><div class=\"callout\">Datele originale și baza completă rămân locale pentru audit.</div></div><div class=\"items\"><div class=\"item\"><b>Formate</b><span>Uniformizăm datele, sumele și valorile lipsă.</span></div><div class=\"item\"><b>Firme</b><span>Comparăm CUI și nume cu snapshotul ONRC.</span></div><div class=\"item\"><b>CPV</b><span>Verificăm codurile și versiunile istorice.</span></div><div class=\"item\"><b>Confidențialitate</b><span>Ascundem textele semnalate în vederea filtrată.</span></div><div class=\"item\"><b>Duplicate</b><span>Marcăm duplicate exacte și identificăm candidați pentru revizuire.</span></div></div></div>",
    "notes": "<p>Am început cu formatele. Am uniformizat datele calendaristice și sumele și am marcat câmpurile lipsă. Apoi am comparat CUI-ul și denumirea firmelor cu registrul ONRC. O potrivire ajută la identificarea firmei, iar statutul ei la data contractului trebuie verificat separat.</p>\n<p>Pentru codurile CPV am folosit nomenclatorul potrivit perioadei. Am completat codurile lipsă când am găsit o singură potrivire și versiunea era compatibilă. În textele libere am căutat indicii precum numere de telefon sau adrese de e-mail și am ascuns câmpurile semnalate în vederea filtrată.</p>\n<p>În final, am separat duplicatele exacte de perechile care doar seamănă. După filtrare, am numărat câte rânduri putem folosi în analiză.</p>"
  },
  {
    "speaker": "Bogdan",
    "body": "<div class=\"grid equal\"><div><div class=\"eyebrow\">05 / Rezultat și calitate</div><h2>Un dataset pregătit<br><span class=\"highlight\">pentru analiză</span></h2><p class=\"lead\">Filtrele fac datele utilizabile, dar nu elimină toate incertitudinile.</p><div class=\"callout\"><b>Atenție:</b> rândurile sunt observații din exporturi, nu neapărat contracte unice sau plăți efective.</div></div><div><div class=\"metrics\"><div class=\"metric dark\"><div class=\"number\">19,85 mil.</div><p>rânduri eligibile pentru analiza valorilor</p></div><div class=\"metric\"><div class=\"number\">119.734</div><p>duplicate exacte marcate</p></div><div class=\"metric\"><div class=\"number\">57.971</div><p>coduri CPV recuperate după reguli stricte</p></div><div class=\"metric\"><div class=\"number\">1,66 mil.</div><p>perechi candidate la duplicare, de verificat</p></div></div><p class=\"small\">Categoriile pot avea suprapuneri. Candidații sunt perechi, nu număr de contracte duplicate. Vederea filtrată nu este un set complet anonimizat.</p></div></div>",
    "notes": "<p>Din cele 20,4 milioane de rânduri, 19,85 milioane trec filtrele pentru analiza valorilor. Au o autoritate identificabilă, o sumă pozitivă și o dată utilizabilă. Am exclus duplicatele exacte din această analiză și am păstrat cele 119.734 de rânduri marcate în baza de proveniență.</p>\n<p>Am recuperat aproape 58.000 de coduri CPV. Cifra de 1,66 milioane se referă la perechi care merită verificate. Același rând poate apărea în mai multe perechi, iar două cumpărări distincte pot semăna între ele.</p>\n<p>În analizele noastre folosim valorile publicate. Pentru a confirma cât s-a plătit efectiv, am avea nevoie de date despre plăți. Cu datele filtrate, putem trece la primul test.</p>"
  },
  {
    "speaker": "Mihnea + Bogdan",
    "body": "<div class=\"eyebrow\">06 / CONCLUZIE</div>\n<h2>Pilot A4<br><span class=\"highlight\">Estimarea valorii</span></h2>\n<div class=\"uses\">\n  <div class=\"use\"><b>01 / Date noi</b><p>T1–T3 2026 · 2,62 mil. rânduri.</p></div>\n  <div class=\"use\"><b>02 / Verificare SICAP</b><p>Cantitate și preț unitar în 2 cazuri.</p></div>\n  <div class=\"use\"><b>03 / Model</b><p>2.866 în istoric, 435 în test.</p></div>\n  <div class=\"use\"><b>04 / Reper</b><p>Mediană generală și pe autoritate.</p></div>\n  <div class=\"use\"><b>05 / Rezultat</b><p>Eroare medie mai mică cu 19%.</p></div>\n  <div class=\"use\"><b>Ce urmează</b><p>Verificăm mai multe cantități în SICAP.</p></div>\n</div>\n<p class=\"small\">Pilot pe valoarea totală publicată a achiziției.</p>",
    "notes": "<p>Mihnea</p>\n<p>Cifrele de la început descriu lotul din 2007–2025. Între timp, am adăugat șase exporturi din primele trei trimestre ale lui 2026, cu încă 2,62 milioane de rânduri. În SICAP am verificat cantitatea și prețul pe top pentru două achiziții de hârtie A4 și le-am regăsit în export. Apoi am rulat un prim test pe valoarea totală a achizițiilor de hârtie A4 care aveau specificații similare în titlu.</p>\n<p>Bogdan</p>\n<p>Am folosit 2.866 de achiziții mai vechi și am testat pe 435 din trimestrul al treilea din 2026. Am comparat mediana generală cu mediana pe autoritate, acolo unde aveam suficiente exemple. În pilot, eroarea absolută medie a scăzut de la 1.893 la 1.528 de lei. Următorul pas este să verificăm cantitățile și prețul pe top într-un eșantion mai mare din SICAP, apoi să repetăm testul.</p>\n<p>Mulțumim.</p>"
  },
  {
    "speaker": "Întrebări",
    "body": "<img class=\"schema-diagram\" src=\"assets/seap-schema.png\" width=\"1920\" height=\"1080\" alt=\"Schema relațională a bazei SEAP, cu surse, organizații, înregistrări, furnizori, CPV, verificări de calitate și conversii BNR.\">",
    "notes": "<p>Fiecare rând importat păstrează legătura cu fișierul de origine. Autoritatea contractantă și furnizorul sunt două roluri ale aceleiași entități, organizația. Putem lega apoi categoria CPV, verificările de calitate și conversia BNR. O achiziție poate apărea în mai multe rânduri, așa că păstrăm originalele și excludem duplicatele exacte din analiza valorilor.</p>"
  }
];
let i=0,showNotes=false;const el=document.getElementById('slide');function render(){const s=slides[i];el.classList.toggle('schema-slide',i===slides.length-1);el.innerHTML=s.body+`<aside class="notes ${showNotes?'open':''}" id="notes"><h3>Note pentru prezentatori</h3>${s.notes}</aside>`;document.getElementById('presenter').textContent=s.speaker;document.getElementById('counter').textContent=String(i+1).padStart(2,'0')+' / '+String(slides.length).padStart(2,'0');document.getElementById('progress').style.width=((i+1)/slides.length*100)+'%';document.getElementById('notesBtn').setAttribute('aria-expanded',showNotes);document.getElementById('notesBtn').textContent=showNotes?'Ascunde notele':'Note vorbitor';document.getElementById('prev').disabled=i===0;document.getElementById('next').disabled=i===slides.length-1;history.replaceState(null,'','#'+(i+1))}function go(d){i=Math.max(0,Math.min(slides.length-1,i+d));render()}const fullscreenBtn=document.getElementById('fullscreenBtn');function syncFullscreen(){const active=!!(document.fullscreenElement||document.webkitFullscreenElement);fullscreenBtn.textContent=active?'⛶ Ieși din ecran complet':'⛶ Ecran complet';fullscreenBtn.setAttribute('aria-label',active?'Ieși din modul ecran complet':'Intră în modul ecran complet')}async function toggleFullscreen(){try{if(document.fullscreenElement||document.webkitFullscreenElement){if(document.exitFullscreen)await document.exitFullscreen();else if(document.webkitExitFullscreen)document.webkitExitFullscreen()}else{const root=document.documentElement;if(root.requestFullscreen)await root.requestFullscreen();else if(root.webkitRequestFullscreen)root.webkitRequestFullscreen();else alert('Folosește modul ecran complet al browserului pentru a ascunde barele de navigare.')}}catch(err){alert('Nu s-a putut activa ecranul complet. Folosește modul ecran complet al browserului.')}}fullscreenBtn.onclick=toggleFullscreen;document.addEventListener('fullscreenchange',syncFullscreen);document.addEventListener('webkitfullscreenchange',syncFullscreen);document.getElementById('prev').onclick=()=>go(-1);document.getElementById('next').onclick=()=>go(1);document.getElementById('notesBtn').onclick=()=>{showNotes=!showNotes;render()};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();go(1)}if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(-1)}if(e.key.toLowerCase()==='n'){showNotes=!showNotes;render()}if(e.key.toLowerCase()==='f'&&!e.metaKey&&!e.ctrlKey&&!e.altKey){e.preventDefault();toggleFullscreen()}});window.addEventListener('hashchange',()=>{
  const requested=Number(location.hash.slice(1));
  if(Number.isInteger(requested)&&requested>=1&&requested<=slides.length){
    i=requested-1;
    render();
  }
});
let start=Number(location.hash.slice(1));if(start>=1&&start<=slides.length)i=start-1;render();
