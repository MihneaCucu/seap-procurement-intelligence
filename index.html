const slides=[
{speaker:'Mihnea',time:'0:00–0:55',body:`<div class="grid"><div><div class="eyebrow">01 / Întrebarea</div><h1>Ce ne spun<br><span class="highlight">achizițiile</span><br>publice?</h1><p class="lead">Construim un dataset unificat pentru a înțelege ce cumpără instituțiile publice, de la cine și la ce valori.</p><div class="tags"><span class="tag">România</span><span class="tag">2007–2025</span><span class="tag">Date deschise</span></div></div><div class="bigcard"><div class="label" style="color:#b9d7bc">Colecția importată</div><div class="stat number">20,4 milioane</div><div class="statlabel">de înregistrări din exporturi publice</div><div class="splitstats"><div><strong>86</strong><span>resurse</span></div><div><strong>19 ani</strong><span>de exporturi</span></div><div><strong>16</strong><span>structuri inițiale</span></div></div></div></div>`,notes:`<p class="timing">Mihnea · ~55 secunde</p><p>Proiectul nostru pornește de la o întrebare simplă: ce putem înțelege despre achizițiile publice din România atunci când aducem datele într-un format comun? Pe data.gov.ro există exporturi publice, dar sunt împărțite pe ani și tipuri de achiziții și au structuri diferite. Asta face dificilă analiza lor împreună.</p><p>Am importat peste 20 de milioane de înregistrări din 86 de resurse, publicate pentru perioada 2007–2025. Scopul este să creăm o bază pe care să putem compara achiziții și să analizăm relațiile dintre instituții și furnizori. Vorbim despre rânduri din exporturi, nu despre 20 de milioane de contracte unice.</p>`},
{speaker:'Andrei',time:'0:55–1:50',body:`<div class="eyebrow">02 / Sursele</div><h2>Date oficiale, <span class="highlight">adunate în timp</span></h2><p class="lead">Sursa principală: exporturi SEAP publicate pe data.gov.ro. Sursele de referință completează verificarea.</p><div class="timeline"><div class="year"><b>2007–2018</b><p>Contracte publicate și contracte subsecvente.</p></div><div class="year"><b>2019–2025</b><p>Contracte publicate și achiziții directe.</p></div><div class="year"><b>Referințe</b><p>BNR pentru curs, ONRC pentru firme, TED pentru CPV.</p></div></div><div class="callout">86 de resurse importate · formate CSV, XLS și XLSX · <b>aprox. 7,67 GB</b> de fișiere-sursă</div><div class="links"><a href="https://data.gov.ro/" target="_blank" rel="noopener">data.gov.ro ↗</a><a href="https://ted.europa.eu/ro/simap/cpv" target="_blank" rel="noopener">TED / CPV ↗</a><a href="https://data.gov.ro/dataset/firme-19-10-2026" target="_blank" rel="noopener">ONRC ↗</a><a href="https://www.bnr.ro/Cursul-de-schimb-524.aspx" target="_blank" rel="noopener">BNR ↗</a></div>`,notes:`<p class="timing">Andrei · ~55 secunde</p><p>Datele principale provin din exporturile SEAP publicate pe portalul guvernamental data.gov.ro. Avem contracte istorice, contracte subsecvente și achiziții directe. Acoperirea diferă după an și tipul înregistrării: nu presupunem că fiecare an conține aceleași categorii sau că am importat toate resursele disponibile.</p><p>Am descărcat 86 de resurse, în formate CSV, XLS și XLSX, care însumează aproximativ 7,67 GB în sursă. Pentru verificare și completare am folosit și trei surse de referință: cursurile istorice BNR, un snapshot ONRC din octombrie 2026 și nomenclatoarele CPV publicate prin TED. Acestea nu transformă automat o potrivire într-o identitate istorică verificată.</p>`},
{speaker:'Andrei',time:'1:50–2:35',body:`<div class="eyebrow">03 / De la surse la dataset</div><h2>Unificăm <span class="highlight">16 structuri</span><br>într-un model comun</h2><div class="steps"><div class="step"><span class="num">01 / IMPORT</span><h3>Descărcare</h3><p>Resursele oficiale și informațiile despre surse sunt păstrate pentru trasabilitate.</p></div><div class="step"><span class="num">02 / PARSARE</span><h3>Formate comune</h3><p>Citire CSV / Excel, interpretarea datelor calendaristice și a sumelor.</p></div><div class="step"><span class="num">03 / MODEL</span><h3>Entități separate</h3><p>Achiziții, autorități, furnizori, coduri CPV și cursuri valutare.</p></div><div class="step"><span class="num">04 / FILTRE</span><h3>Vederi analitice</h3><p>Înregistrările eligibile sunt selectate; originalele rămân pentru audit.</p></div></div><div class="callout">Modelul păstrează valoarea și moneda originală. Echivalentul în EUR folosește cursul BNR disponibil la sau înaintea datei alese.</div>`,notes:`<p class="timing">Andrei · ~45 secunde</p><p>După descărcare, am parsat fișierele și am mapat 16 structuri de coloane într-o schemă comună. Am uniformizat valorile lipsă, am interpretat datele calendaristice și am transformat sumele în valori numerice, păstrând textul original pentru audit.</p><p>În model am separat achizițiile de organizații și de datele de referință, cum ar fi codurile CPV și cursurile. Pentru comparații monetare, păstrăm suma și moneda inițială și calculăm echivalentul în euro cu ultima cotație oficială disponibilă la sau înaintea datei relevante, în limita de șapte zile. Vederile analitice selectează înregistrările eligibile; sursele nu sunt șterse.</p>`},
{speaker:'Darius',time:'2:35–3:40',body:`<div class="grid equal"><div><div class="eyebrow">04 / Curățarea</div><h2>Cinci verificări,<br><span class="highlight">limite clare</span></h2><p class="lead">Curățarea înseamnă și să marcăm ce trebuie verificat, nu doar să eliminăm rânduri.</p><div class="callout">Datele originale și baza completă rămân locale pentru audit.</div></div><div class="items"><div class="item"><b>Formate</b><span>Uniformizăm datele, sumele și valorile lipsă.</span></div><div class="item"><b>Firme</b><span>Comparăm CUI și nume cu snapshotul ONRC.</span></div><div class="item"><b>CPV</b><span>Verificăm codurile și versiunile istorice.</span></div><div class="item"><b>Confidențialitate</b><span>Ascundem textele semnalate în vederea filtrată.</span></div><div class="item"><b>Duplicate</b><span>Marcăm duplicate exacte și identificăm candidați pentru revizuire.</span></div></div></div>`,notes:`<p class="timing">Darius · ~65 secunde</p><p>Am curățat datele în mai multe etape. Mai întâi am standardizat formatele și am marcat valorile lipsă sau neinterpretabile. Am comparat identificatorii și numele organizațiilor cu un snapshot ONRC: este o verificare utilă, dar nu dovedește statutul istoric al firmei.</p><p>Am verificat codurile CPV față de nomenclatoarele oficiale și am recuperat unele coduri lipsă numai când exista o corespondență unică și contextul era compatibil. Am scanat textele pentru semnale precum adrese de email sau numere de telefon și am ascuns textele semnalate din vederea filtrată. Aceasta nu garantează anonimizare completă.</p><p>În final, am marcat duplicatele exacte și am generat perechi aproximative pentru verificare. Perechile candidate nu sunt automat duplicate confirmate și nu au fost șterse automat.</p>`},
{speaker:'Bogdan',time:'3:40–4:45',body:`<div class="grid equal"><div><div class="eyebrow">05 / Rezultat și calitate</div><h2>Un dataset pregătit<br><span class="highlight">pentru analiză</span></h2><p class="lead">Filtrele fac datele utilizabile, dar nu elimină toate incertitudinile.</p><div class="callout"><b>Atenție:</b> rândurile sunt observații din exporturi, nu neapărat contracte unice sau plăți efective.</div></div><div><div class="metrics"><div class="metric dark"><div class="number">19,85 mil.</div><p>rânduri eligibile pentru analiza valorilor</p></div><div class="metric"><div class="number">119.734</div><p>duplicate exacte marcate</p></div><div class="metric"><div class="number">57.971</div><p>coduri CPV recuperate după reguli stricte</p></div><div class="metric"><div class="number">1,66 mil.</div><p>perechi candidate la duplicare, de verificat</p></div></div><p class="small">Categoriile pot avea suprapuneri. Candidații sunt perechi, nu număr de contracte duplicate. Vederea filtrată nu este un set complet anonimizat.</p></div></div>`,notes:`<p class="timing">Bogdan · ~65 secunde</p><p>Din cele 20,4 milioane de rânduri importate, aproximativ 19,85 milioane trec filtrele pentru analiza valorilor: au, între altele, autoritate, valoare pozitivă și o dată interpretabilă și nu sunt marcate drept duplicate exacte. Am marcat 119.734 de duplicate exacte fără a șterge datele-sursă.</p><p>Am recuperat 57.971 de coduri CPV folosind potriviri cu denumiri oficiale și context istoric compatibil. Am identificat aproximativ 1,66 milioane de perechi candidate la duplicare, nu duplicate confirmate. Verificarea lor rămâne o etapă viitoare.</p><p>Rezultatele se referă la înregistrări din exporturi: un contract poate apărea în mai multe observații, iar valoarea publicată nu dovedește o plată efectivă. Baza internă și vederea filtrată nu sunt complet anonimizate.</p>`},
{speaker:'Mihnea + Bogdan',time:'4:45–6:00',body:`<div class="eyebrow">06 / Utilizare și pașii următori</div><h2>De la date curate<br><span class="highlight">la întrebări mai bune</span></h2><div class="uses"><div class="use"><b>01 / Predicția valorii</b><p>Estimăm valori pentru achiziții comparabile.</p></div><div class="use"><b>02 / Detectarea anomaliilor</b><p>Semnalăm tipare care merită verificate.</p></div><div class="use"><b>03 / Prognoză</b><p>Analizăm tendințele valorilor în timp.</p></div><div class="use"><b>04 / Rețele și furnizori</b><p>Explorăm relațiile dintre instituții și firme.</p></div><div class="use"><b>05 / Clasificare produse</b><p>Folosim descrierile și codurile CPV.</p></div><div class="use"><b>Mai departe</b><p>Verificăm duplicate, date personale și surse noi.</p></div></div><p class="small">Aplicații planificate. O anomalie sau o posibilă legătură cu o persoană publică nu dovedește o neregulă și cere verificare independentă.</p>`,notes:`<p class="timing">Mihnea · ~35 secunde; Bogdan · ~40 secunde</p><p><b>Mihnea:</b> Datasetul ne oferă o bază pentru cinci direcții pe care vrem să le explorăm: predicția valorii, detectarea anomaliilor, prognoza în timp, analiza rețelei instituții–furnizori și clasificarea produselor după descriere și CPV. Acestea sunt utilizări planificate, nu modele deja validate. De exemplu, o valoare mare poate fi explicată prin cantitate sau specificații, deci comparabilitatea rămâne esențială.</p><p><b>Bogdan:</b> În continuare vom verifica duplicatele candidate și identitățile ambigue, vom îmbunătăți protecția datelor personale și vom căuta surse care pot completa contextul. Putem explora și posibile legături cu persoane publice dacă găsim surse relevante și verificabile. O asociere sau o anomalie nu dovedește însă o neregulă. La final vom evalua dacă datele sunt utile pentru una dintre aceste sarcini și vom prezenta limitele.</p>`}];
let i=0,showNotes=false;const el=document.getElementById('slide');function render(){const s=slides[i];el.innerHTML=s.body+`<aside class="notes ${showNotes?'open':''}" id="notes"><h3>Note pentru prezentatori</h3>${s.notes}</aside>`;document.getElementById('presenter').innerHTML=s.speaker+`<span>${s.time}</span>`;document.getElementById('counter').textContent=String(i+1).padStart(2,'0')+' / 06';document.getElementById('progress').style.width=((i+1)/6*100)+'%';document.getElementById('notesBtn').setAttribute('aria-expanded',showNotes);document.getElementById('notesBtn').textContent=showNotes?'Ascunde notele':'Note vorbitor';document.getElementById('prev').disabled=i===0;document.getElementById('next').disabled=i===5;history.replaceState(null,'','#'+(i+1))}function go(d){i=Math.max(0,Math.min(5,i+d));render()}const fullscreenBtn=document.getElementById('fullscreenBtn');function syncFullscreen(){const active=!!(document.fullscreenElement||document.webkitFullscreenElement);fullscreenBtn.textContent=active?'⛶ Ieși din ecran complet':'⛶ Ecran complet';fullscreenBtn.setAttribute('aria-label',active?'Ieși din modul ecran complet':'Intră în modul ecran complet')}async function toggleFullscreen(){try{if(document.fullscreenElement||document.webkitFullscreenElement){if(document.exitFullscreen)await document.exitFullscreen();else if(document.webkitExitFullscreen)document.webkitExitFullscreen()}else{const root=document.documentElement;if(root.requestFullscreen)await root.requestFullscreen();else if(root.webkitRequestFullscreen)root.webkitRequestFullscreen();else alert('Folosește modul ecran complet al browserului pentru a ascunde barele de navigare.')}}catch(err){alert('Nu s-a putut activa ecranul complet. Folosește modul ecran complet al browserului.')}}fullscreenBtn.onclick=toggleFullscreen;document.addEventListener('fullscreenchange',syncFullscreen);document.addEventListener('webkitfullscreenchange',syncFullscreen);document.getElementById('prev').onclick=()=>go(-1);document.getElementById('next').onclick=()=>go(1);document.getElementById('notesBtn').onclick=()=>{showNotes=!showNotes;render()};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();go(1)}if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(-1)}if(e.key.toLowerCase()==='n'){showNotes=!showNotes;render()}if(e.key.toLowerCase()==='f'&&!e.metaKey&&!e.ctrlKey&&!e.altKey){e.preventDefault();toggleFullscreen()}});let start=Number(location.hash.slice(1));if(start>=1&&start<=6)i=start-1;render();
</script></body></html>
